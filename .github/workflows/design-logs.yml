name: Design logs (read a run's log)
# Only on the design-samples branch: saves the log of one news run to the design-logs-out branch.
on:
  push:
    branches: [design-samples]
    paths: [".github/workflows/design-logs.yml"]
permissions:
  contents: write
  actions: read
jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out && cd out
          curl -sSL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/jobs/123168830201/logs" -o log.txt -w "%{http_code}" > code.txt 2> err.txt || true
          grep -n -i -B3 -A25 "Traceback" log.txt | head -150 > traceback.txt || true
          tail -120 log.txt > tail.txt
          git init -q && git checkout -q -b design-logs-out && git add -A
          git -c user.name="design-logs" -c user.email="actions@users.noreply.github.com" commit -qm "logs 123168830201"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" design-logs-out
