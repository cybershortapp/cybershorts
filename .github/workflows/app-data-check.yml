name: app-data-check

# Reads the news, games and trending deck exactly the way the app does (with the app's public key),
# to check the app can see them. Run it by hand from the Actions tab. Changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ask like the app does
        run: |
          URL=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_URL' app/eas.json)
          KEY=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_KEY' app/eas.json)
          case "$KEY" in sb_publishable_*) ;; *) echo "::error::not the public key"; exit 1;; esac
          ask() { curl -s "$URL/rest/v1/$1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"; }
          Q='stories?select=headline,source,image_url,created_at&or=(headline.ilike.*GMO*,headline.ilike.*note*,source.ilike.*Iran*,headline.ilike.*Baluch*)&order=created_at.desc&limit=8'
          ask "$Q" > s.json
          pip install -q pillow
          jq -r '.[] | select(.image_url != null) | .image_url' s.json > urls.txt
          python3 - <<'PY'
          import base64, io, urllib.request
          from PIL import Image
          for i, u in enumerate(open("urls.txt").read().split()):
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (Linux; Android 14)", "Accept": "image/webp,image/*"})
                  im = Image.open(io.BytesIO(urllib.request.urlopen(req, timeout=20).read())).convert("RGB")
                  w, h = im.size
                  im.thumbnail((200, 120))
                  b = io.BytesIO(); im.save(b, "JPEG", quality=70)
                  print(f"::notice title=pic{i} {w}x{h}::{base64.b64encode(b.getvalue()).decode()}")
              except Exception as ex:
                  print(f"::notice title=pic{i} failed::{u} {ex}")
          PY
