name: app-data-check

# Reads the news, games and trending deck exactly the way the app does (with the app's public key),
# to check the app can see them. Run it by hand from the Actions tab. Changes nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Ask like the app does
        run: |
          URL=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_URL' app/eas.json)
          KEY=$(jq -r '.build.production.env.EXPO_PUBLIC_SUPABASE_KEY' app/eas.json)
          case "$KEY" in sb_publishable_*) ;; *) echo "::error::not the public key"; exit 1;; esac
          ask() { curl -s "$URL/rest/v1/$1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY"; }
          ask 'stories?select=headline,source,image_url&or=(source.eq.note,source.ilike.*Iran*)&order=created_at.desc&limit=30' > s.json
          echo "::notice title=copies::$(jq 'length' s.json) stories use a copy"
          jq -r '.[] | [.source, .image_url] | @tsv' s.json > rows.tsv
          python3 - <<'PY'
          import io, urllib.request
          out = []
          for line in open("rows.tsv"):
              src, u = line.rstrip("\n").split("\t")
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "okhttp/4.12.0"}), timeout=20)
                  b = r.read(); ct = r.headers.get("content-type")
                  w = h = 0
                  if b[:2] == b"\xff\xd8":
                      i = 2
                      while i < len(b):
                          m = b[i+1]; n = int.from_bytes(b[i+2:i+4], "big")
                          if m in (0xC0, 0xC2): h = int.from_bytes(b[i+5:i+7], "big"); w = int.from_bytes(b[i+7:i+9], "big"); break
                          i += 2 + n
                  out.append(f"{src} {len(b)//1024}KB {ct} {w}x{h} {u[-60:]}")
              except Exception as ex:
                  out.append(f"{src} FAILED {ex}")
          for k in range(0, len(out), 15):
              print("::notice title=part" + str(k) + "::" + " %0A ".join(out[k:k+15]))
          PY
