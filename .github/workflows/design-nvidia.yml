name: Design NVIDIA probe
# Only on the design-samples branch. Read-only: one tiny request per NVIDIA model, to see why they fail.
on:
  push:
    branches: [design-samples]
    paths: ["design/nvidia_probe.py", ".github/workflows/design-nvidia.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/checkout@v5
        with:
          path: ds
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -q -r pipeline/requirements.txt
      - env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CANDIDATES: "google/gemma-4-31b-it,nvidia/llama-3.1-nemotron-ultra-253b-v1,openai/gpt-oss-20b,nvidia/nemotron-3.5-lightning-30b-a3b,nvidia/llama-3.1-nemotron-70b-instruct,mistralai/mistral-large-2-instruct,minimaxai/minimax-m3.1-flash"
        run: python ds/design/nvidia_probe.py 2>&1 | tail -40 | tee probe.txt; echo "::notice::$(grep -E '^(OK|FAIL)' probe.txt | tr '\n' '#')"
