name: store-build-status

# Shows the latest Play Store builds on Expo and the download link of the finished .aab.
# Run it by hand from the Actions tab; the result is in the run's notes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Latest store builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if ! npx eas-cli build:list --platform android --limit 5 --json --non-interactive > builds.json 2> err.txt; then
            echo "::error title=Expo::$(tail -c 400 err.txt | tr '\n' ' ')"; exit 1
          fi
          jq -r '.[] | select(.buildProfile == "production") | "\(.status) | \(.createdAt) | version \(.appVersion) (\(.appBuildVersion)) | \(.artifacts.applicationArchiveUrl // .artifacts.buildUrl // "not ready")"' builds.json | while read -r line; do
            echo "::notice title=Store build::$line"
          done
