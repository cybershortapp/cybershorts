name: store-build-status

# Shows the latest Play Store builds on Expo and the download link of the finished .aab.
# Run it by hand from the Actions tab; the result is in the run's notes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Latest store builds
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli build:list --platform android --buildProfile production --limit 3 --json --non-interactive > builds.json
          jq -r '.[] | "\(.status) | \(.createdAt) | version \(.appVersion) (\(.appBuildVersion)) | \(.artifacts.applicationArchiveUrl // .artifacts.buildUrl // "not ready")"' builds.json | while read -r line; do
            echo "::notice title=Store build::$line"
          done
