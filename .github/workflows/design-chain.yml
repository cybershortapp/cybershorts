name: Design chain check
# Only on the design-samples branch. Read-only: dry run of the chain second try (nothing is written).
on:
  push:
    branches: [design-samples]
    paths: ["design/chain_dry.py", ".github/workflows/design-chain.yml"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chain-catchup
      - uses: actions/checkout@v5
        with:
          path: ds
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -q -r pipeline/requirements.txt
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          AI_PROVIDER: "gemini,nvidia,ovh,gemini-lite,groq,mistral"
        run: python ds/design/chain_dry.py 2>&1 | tee out.txt; echo "::notice::$(grep -E 'WOULD WRITE|RESULT|chain\]' out.txt | cut -c1-230 | tr '\n' '#')"
