name: backup

# Weekly copy of the database, kept as a download on this workflow's runs for 90 days.
# Personal data (subscribers, devices) is encrypted with the Supabase service key as the password,
# because this repository is public. To restore it: gpg --decrypt private.tar.gpg (password = the service key).
on:
  schedule:
    - cron: "23 3 * * 0"   # Sundays 03:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Export the tables
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python backup.py
      - name: Encrypt personal data
        env:
          PASS: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          tar -cf private.tar -C backup private
          echo "$PASS" | gpg --batch --yes --passphrase-fd 0 --symmetric --cipher-algo AES256 -o backup/private.tar.gpg private.tar
          rm -rf private.tar backup/private
          ls -la backup
      - uses: actions/upload-artifact@v4
        with:
          name: cybersid-backup-${{ github.run_number }}
          path: pipeline/backup/
          retention-days: 90
