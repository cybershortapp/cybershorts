name: app-update

# When app code changes on main, publish it to the test app (preview channel) with EAS Update.
# Phones running a preview build download it the next time the app is opened. No PC needed.
# Needs one repository secret: EXPO_TOKEN (expo.dev > Account settings > Access tokens).
on:
  push:
    branches: [main]
    paths: ["app/**", "!app/**/*.md"]
  # on pull requests it builds and checks the update but does not publish it
  pull_request:
    paths: ["app/**", ".github/workflows/app-update.yml"]
  workflow_dispatch:
    inputs:
      message:
        description: "What changed"
        required: false
        default: "Manual update"
      channel:
        description: "Who gets it: preview (test app) or production (Play Store users, same app version only)"
        required: false
        default: "preview"
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: app-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check the Expo token is set
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      # the app's public settings (Supabase address and publishable key) come from eas.json, same as the builds.
      # They are put straight into the environment, so they are baked into the update whatever EAS does with .env files.
      - name: Write app settings
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'preview' }}
        run: |
          jq -r --arg p "$CHANNEL" '.build[$p].env | to_entries[] | "\(.key)=\(.value)"' eas.json > .env
          cat .env >> "$GITHUB_ENV"
          echo "Settings found: $(cut -d= -f1 .env | tr '\n' ' ')"
          grep -q '^EXPO_PUBLIC_SUPABASE_URL=https://' .env && grep -q '^EXPO_PUBLIC_SUPABASE_KEY=sb_publishable_' .env \
            || { echo "::error::Supabase settings missing from eas.json"; exit 1; }
      - name: Type check
        run: npx tsc --noEmit
      - name: Build the update
        run: npx expo export --platform all --output-dir dist
      # safety net: never publish an update that can't reach the news (this exact mistake happened once)
      - name: Check the settings are inside the update
        run: |
          for p in android ios; do
            f=$(ls dist/_expo/static/js/$p/*.hbc dist/_expo/static/js/$p/*.js 2>/dev/null | grep -v '\.map$' | head -1)
            [ -n "$f" ] || { echo "::error::No $p bundle was built"; exit 1; }
            grep -aq "$EXPO_PUBLIC_SUPABASE_URL" "$f" || { echo "::error::Supabase address is missing from the $p update. Not publishing."; exit 1; }
            echo "$p update contains the app settings: OK"
          done
      # preview: the test app. production: Play Store users, only by hand and only on the main code.
      # An update only reaches phones with the same app version (runtimeVersion follows the version number).
      - name: Publish the update
        if: github.event_name != 'pull_request'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ github.event.inputs.message || github.event.head_commit.message }}
          CHANNEL: ${{ github.event.inputs.channel || 'preview' }}
        run: |
          if [ "$CHANNEL" = "production" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Updates for Play Store users are only sent from main."; exit 1
          fi
          npx eas-cli update --channel "$CHANNEL" --environment "$CHANNEL" --skip-bundler --input-dir dist --message "$(echo "$MESSAGE" | head -n1 | cut -c1-80)" --non-interactive
