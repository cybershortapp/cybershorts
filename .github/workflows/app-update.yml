name: app-update

# When app code changes on main, publish it to the test app (preview channel) with EAS Update.
# Phones running a preview build download it the next time the app is opened. No PC needed.
# Needs one repository secret: EXPO_TOKEN (expo.dev > Account settings > Access tokens).
on:
  push:
    branches: [main]
    paths: ["app/**", "!app/**/*.md"]
  workflow_dispatch:
    inputs:
      message:
        description: "What changed"
        required: false
        default: "Manual update"

permissions:
  contents: read

concurrency:
  group: app-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check the Expo token is set
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # the app's public settings (Supabase address and publishable key) come from eas.json, same as the builds
      - name: Write app settings
        run: |
          jq -r '.build.preview.env | to_entries[] | "\(.key)=\(.value)"' eas.json > .env
          cut -d= -f1 .env
      - name: Type check
        run: npx tsc --noEmit
      - name: Publish update to the preview channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MESSAGE: ${{ github.event.inputs.message || github.event.head_commit.message }}
        run: npx eas-cli update --channel preview --environment preview --message "$(echo "$MESSAGE" | head -n1 | cut -c1-80)" --non-interactive
