name: news-pipeline
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes, at 7 and 37 past the hour (UTC)
  workflow_dispatch:         # lets you run it by hand from the Actions tab
permissions:
  contents: read
  actions: write        # only used to keep this hourly schedule switched on (see the first step)
concurrency:
  group: news-pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    # the news step stops itself after about 11 minutes; this is only the hard stop if something hangs
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      # GitHub pauses scheduled robots in public repos after 60 days with no code changes.
      # Once a day this re-confirms the schedule so the news never silently stops.
      - name: Keep the hourly schedule switched on
        if: github.event_name == 'schedule'
        working-directory: .
        run: |
          if [ "$(date -u +%H)" = "03" ]; then
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pipeline.yml/enable" && echo "Schedule re-confirmed" || echo "Could not re-confirm (not a problem today)"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r requirements.txt
      - id: news
        run: python pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AI_PROVIDER: "gemini,nvidia,ovh,gemini-lite,groq,mistral,cerebras"
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}         # card pictures on Cloudflare R2 (store.py); without
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }} # these, pictures stay on Supabase storage
          PICTURES_URL: ${{ secrets.PICTURES_URL }}
          AI_HORDE_KEY: ${{ secrets.AI_HORDE_KEY }}             # optional: free key from aihorde.net, faster queue
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }} # optional: removes the Pollinations watermark
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          COVERS: "true"
          COVERS_PER_RUN: "12"
          TEST_MODE: "false"
          USE_AI: "true"
          MAX_AI_CALLS: "40"
          DAILY_AI_CAP: "2000"
      # new pictures: start the 3D depth maps now (about 5 minutes) instead of waiting for depth.yml's hourly
      # timer, which GitHub often skips. That hourly run stays as the backup.
      - name: Start the 3D depth maps for the new pictures
        if: success() && steps.news.outputs.new_pictures != '' && steps.news.outputs.new_pictures != '0'
        working-directory: .
        run: gh workflow run depth.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}" || echo "Could not start the 3D job now; its hourly run will catch up"
        env:
          GH_TOKEN: ${{ github.token }}
