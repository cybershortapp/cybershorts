name: source-check

# Checks every news source (and the AI picture service) without changing anything.
# Runs on pull requests that touch the sources, and by hand from the Actions tab.
# On a pull request the result is posted as a comment, so it can be read from a phone.
on:
  pull_request:
    paths: ["pipeline/sources.py", "pipeline/data_feeds.py", "pipeline/tips.json", "pipeline/tips.py", "pipeline/history.json", "pipeline/history.py", "pipeline/daily.py", ".github/workflows/source-check.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: Check all sources
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          AI_PROVIDER: "gemini,cerebras,groq"
        run: |
          python pipeline.py --health --no-picture 2>&1 | tee health.txt
          python pipeline.py --check-tips 2>&1 | tee -a health.txt || true
          # the AI writes one new tip and one history card from real pages, without posting them
          python pipeline.py --skipped 2>&1 | grep -v '^::' | tee -a health.txt || true
          python pipeline.py --try-daily 2>&1 | grep -v '^::' | tee -a health.txt || true
          { echo '### Source check'; echo '```'; cat health.txt; echo '```'; } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the result on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file report.md
