appId: app.cybersid.news
name: Open the app and reach the first card (crash check, part 1)
# Only the start: Maestro waits for the screen to go still between steps, and the card's moving picture and
# wave never stop, so it hung after a few swipes. The swiping is done with plain adb in run.sh instead.
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- extendedWaitUntil:
    visible: "(Skip|Next|Read full story.*)"
    timeout: 90000
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Read full story.*"
    timeout: 90000
- takeScreenshot: a-first-card
