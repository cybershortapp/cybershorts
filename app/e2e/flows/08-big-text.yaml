appId: app.cybersid.news
name: Large phone text (accessibility) - feed, chain, settings, Play
---
- launchApp
- extendedWaitUntil:
    visible: "Read full story.*"
    timeout: 40000
- takeScreenshot: A0-big-text-feed
- runFlow:
    commands:
      - repeat:
          while:
            notVisible: "Show attack chain"
          times: 30
          commands:
            - swipe:
                start: "50%, 80%"
                end: "50%, 20%"
                duration: 300
            - waitForAnimationToEnd:
                timeout: 2500
      - assertVisible: "Show attack chain"
      - tapOn: "Show attack chain"
      - extendedWaitUntil:
          visible: "Back to the story"
          timeout: 15000
      - waitForAnimationToEnd
      - takeScreenshot: A1-big-text-chain
      - back
    optional: true
- tapOn: "Preferences"
- waitForAnimationToEnd
- takeScreenshot: A2-big-text-settings
- tapOn: "Done"
- tapOn: "Play games"
- waitForAnimationToEnd
- takeScreenshot: A3-big-text-play
- back
