appId: app.cybersid.news
name: Games and the trending deck between the news cards
---
- launchApp
- extendedWaitUntil:
    visible: "(Read full story.*|Skip)"
    timeout: 40000
# a fresh install shows the welcome screens first
- runFlow:
    when:
      visible: "Skip"
    commands:
      - tapOn: "Skip"
- extendedWaitUntil:
    visible: "Read full story.*"
    timeout: 40000
- runFlow:
    commands:
      - repeat:
          while:
            notVisible: "30 SECOND GAME"
          times: 30
          commands:
            - swipe:
                start: "50%, 80%"
                end: "50%, 20%"
                duration: 300
            - waitForAnimationToEnd:
                timeout: 2500
      - assertVisible: "30 SECOND GAME"
      - waitForAnimationToEnd
      - takeScreenshot: 80-game-in-feed
      - swipe:
          start: "50%, 85%"
          end: "50%, 15%"
          duration: 300
      - waitForAnimationToEnd
      - takeScreenshot: 81-after-game
    optional: true
- tapOn:
    text: "Back to the latest stories"
    optional: true
- waitForAnimationToEnd
- runFlow:
    commands:
      - repeat:
          while:
            notVisible: "TRENDING.*"
          times: 30
          commands:
            - swipe:
                start: "50%, 80%"
                end: "50%, 20%"
                duration: 300
            - waitForAnimationToEnd:
                timeout: 2500
      - assertVisible: "TRENDING.*"
      - waitForAnimationToEnd
      - takeScreenshot: 82-trending-deck
      - swipe:
          start: "85%, 50%"
          end: "10%, 50%"
          duration: 300
      - waitForAnimationToEnd
      - takeScreenshot: 83-trending-deck-slide-2
    optional: true
